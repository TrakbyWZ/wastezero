name: Build Windows Upload Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "windows-upload-service-dotnet/**"
      - ".github/workflows/windows-upload-service.yml"

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Publish self-contained (win-x64, .NET 6 runtime bundled)
        run: >
          dotnet publish
          windows-upload-service-dotnet/src/WasteZero.WindowsUploadService/WasteZero.WindowsUploadService.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          --output "${{ github.workspace }}/artifacts/publish"

      - name: Bundle Install-Service and Uninstall-Service scripts
        shell: pwsh
        run: |
          Copy-Item -Path @(
            "windows-upload-service-dotnet/scripts/Install-Service.ps1",
            "windows-upload-service-dotnet/scripts/Uninstall-Service.ps1"
          ) -Destination "artifacts/publish/" -Force

      - name: Bundle project source for PublishAndCopy
        shell: pwsh
        run: |
          $src = Join-Path "${{ github.workspace }}" "windows-upload-service-dotnet/src/WasteZero.WindowsUploadService"
          $dest = Join-Path "${{ github.workspace }}" "artifacts/publish/project-source"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Get-ChildItem -LiteralPath $src -Force | ForEach-Object {
            if ($_.Name -in @('bin', 'obj')) { return }
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $dest $_.Name) -Recurse -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WasteZero.WindowsUploadService-win-x64-self-contained
          path: artifacts/publish/
          if-no-files-found: error
